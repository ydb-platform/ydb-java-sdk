name: CodeQL

on:
  push:
    branches: ["master", "develop", "release*"]
  pull_request:
    branches: ["master", "develop", "release*"]
  merge_group:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
            config: .github/codeql/sdk.yml
          - language: actions
            build-mode: none
            config: .github/codeql/actions.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.config }}

      - name: Build Java SDK and authentication API
        if: matrix.language == 'java-kotlin'
        run: |
          mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true clean package
          mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true -f auth-api/pom.xml clean package

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
