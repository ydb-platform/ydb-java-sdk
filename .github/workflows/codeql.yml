name: CodeQL

on:
  push:
    branches: ["master", "release*"]
  pull_request:
      type: [opened, reopened, edited, synchronize]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    name: CodeQL (Github Actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:actions

  analyze-sdk:
    name: CodeQL (YDB Java SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build Java SDK
        run:  mvn --batch-mode --no-transfer-progress -Pwith-auth-api -Dmaven.test.skip=true clean package

      - name: Analyze and upload results
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
